site_name: Kitsune
site_description: Drive the Firefox, Zen, or LibreWolf browser you already have open from Python or an AI agent.
# The landing page (landing/) is served at /kitsune/; the docs live under /kitsune/docs/.
site_url: https://junyeong-nero.github.io/kitsune/docs/
repo_url: https://github.com/junyeong-nero/kitsune
repo_name: junyeong-nero/kitsune
edit_uri: edit/main/docs/

theme:
  name: material
  # Colors match assets/kitsune-hero.png; see docs/stylesheets/extra.css.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  # The header logo links back to the landing page.
  homepage: https://junyeong-nero.github.io/kitsune/

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Content tabs (installation steps per client). Slugified ids make tabs linkable: #opencode.
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # index.md pulls in README.md so the home page and the README stay in sync.
  - pymdownx.snippets:
      check_paths: true

# Maintainer-only pages: kept in the repo, left out of the site.
exclude_docs: |
  releasing.md
  recording-the-demo.md

# Some pages link to source files outside docs/ (../src, ../extension); don't warn on those.
validation:
  links:
    not_found: info
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Windows: windows.md
      - Try it: try-it.md
  - Concepts:
      - How it works: how-it-works.md
      - Your tabs and approvals: your-tabs.md
      - Tools: tools.md
      - Security: security.md
  - Guides:
      - Configuration: configuration.md
      - Python API: python-api.md
      - Checkpoint and resume: checkpoint-resume.md
  - Reference:
      - API reference: api-reference.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - About:
      - Benchmark and comparison: benchmark.md
      - Philosophy: philosophy.md
  - Contributing:
      - Development: development.md
