<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Kitsune</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1>Kitsune<span class="brand-dot">.</span></h1>
    <span id="connection" class="connection" role="status">Connecting…</span>
  </header>

  <main>
    <section class="usage" aria-label="MCP usage">
      <div>
        <span class="label" title="Completed MCP calls, including errors">MCP calls</span>
        <strong id="calls" class="metric">—</strong>
      </div>
      <div>
        <span class="label">Last active</span>
        <strong id="last-active" class="metric metric-time">—</strong>
      </div>
      <p id="usage-note" class="note">Since bridge connected · all clients</p>
    </section>

    <section id="handoffs" aria-label="Tab access" aria-live="polite"></section>

    <section class="tab-controls" aria-labelledby="tabs-heading">
      <div class="section-heading">
        <h2 id="tabs-heading">Agent tabs</h2>
        <span id="count" class="count" aria-label="Open agent tabs">…</span>
      </div>
      <button id="close-all" class="button button-outlined" disabled>Close agent tabs</button>
      <p id="result" class="note" role="status" hidden></p>
      <div class="setting">
        <label for="idle">Auto-close after</label>
        <select id="idle" aria-describedby="idle-note">
          <option value="0">Never</option>
          <option value="5">5 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
          <option value="120">2 hours</option>
          <option value="240">4 hours</option>
        </select>
      </div>
      <p id="idle-note" class="note">Idle tabs only. Pin a tab to keep it open.</p>
    </section>
  </main>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
