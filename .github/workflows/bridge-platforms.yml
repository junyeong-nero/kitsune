name: Bridge platforms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      KITSUNE_TOKEN: synthetic-ci-token-not-a-real-secret
      KITSUNE_HOME: ${{ github.workspace }}/.ci-bridge-home
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -p test_bridge_lifecycle.py -q
      - run: uv run --frozen python -m unittest discover -s tests -p test_bridge_security.py -q
      - run: uv run --frozen python -m unittest discover -s tests -p test_windows_lifecycle.py -q
      - run: node tests/tab_handoff_races.cjs
