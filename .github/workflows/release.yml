# Publishes kitsune-browser-mcp with PyPI Trusted Publishing (no API tokens).
# - Push a tag `vX.Y.Z` matching pyproject.toml's version: test, build, sign the
#   extension on AMO (unlisted), publish to PyPI, and create a GitHub release with
#   the dist files, the signed XPI, its updates.json, and the developer-build zip.
# - Run manually (workflow_dispatch) to publish the current ref to TestPyPI.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag matches project version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: |
          uv run python -m unittest discover -s tests -q
          for test in tests/*.cjs; do node "$test"; done

      - name: Build
        run: |
          uv build
          uvx twine check dist/*

      - name: Build extension variants
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv run --no-project python scripts/build_extension.py signed --out build/extension-signed
          uv run --no-project python scripts/build_extension.py dev --out build/extension-dev \
            --zip "kitsune-extension-dev-$version.zip"

      # AMO runs the same validator (--self-hosted for unlisted uploads, which allows
      # update_url); keep the signed build free of warnings.
      - name: Lint signed extension
        run: npx --yes web-ext@10 lint --self-hosted --source-dir build/extension-signed --warnings-as-errors

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dev
          path: kitsune-extension-dev-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-signed-source
          path: build/extension-signed/

  sign-extension:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: amo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-signed-source
          path: extension-signed/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sign on AMO (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10 sign --channel unlisted --source-dir extension-signed \
            --artifacts-dir signed --approval-timeout 1800000
          mv signed/*.xpi "kitsune-${GITHUB_REF_NAME#v}.xpi"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-xpi
          path: kitsune-*.xpi

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  pypi:
    if: github.ref_type == 'tag'
    needs: [build, sign-extension]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always

  github-release:
    if: github.ref_type == 'tag'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{dist,extension-dev,extension-xpi}"
          path: artifacts/
          merge-multiple: true
      # Signed installs fetch releases/latest/download/updates.json, so this release
      # must be marked latest. It is created only after the PyPI publish succeeds.
      - name: Generate update manifest
        run: python3 scripts/update_manifest.py "artifacts/kitsune-${GITHUB_REF_NAME#v}.xpi" --out artifacts/updates.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --latest
