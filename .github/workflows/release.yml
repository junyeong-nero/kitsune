# Publishes kitsune-browser-mcp with PyPI Trusted Publishing (no API tokens).
# - Push a tag `vX.Y.Z` matching pyproject.toml's version: test, build, publish
#   to PyPI, and create a GitHub release with the dist files and extension zip.
# - Run manually (workflow_dispatch) to publish the current ref to TestPyPI.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag matches project version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: |
          uv run python -m unittest discover -s tests -q
          for test in tests/*.cjs; do node "$test"; done

      - name: Build
        run: |
          uv build
          uvx twine check dist/*

      - name: Package extension
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          (cd extension && zip -qr "../kitsune-extension-$version.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: kitsune-extension-*.zip

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always

  github-release:
    if: github.ref_type == 'tag'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes
