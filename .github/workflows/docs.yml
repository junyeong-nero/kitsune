# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://junyeong-nero.github.io/kitsune/: the landing page (landing/) at the root and the
# MkDocs docs under /docs/. See scripts/build_site.py.
# Preview the docs alone with `uv run --group docs mkdocs serve`.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "landing/**"
      - "README.md"
      - "mkdocs.yml"
      - "scripts/build_site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
      - run: uv run --only-group docs python scripts/build_site.py _site
      - run: uv run --only-group docs ghp-import --no-jekyll --push --force --message "Deploy ${{ github.sha }}" _site
