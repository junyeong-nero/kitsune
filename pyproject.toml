[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitsune-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents drive your running Firefox or Zen browser through an extension."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",  # mcp 2.x renamed FastMCP to MCPServer
    "httpx>=0.27.0",
    "websockets>=12",
]

[project.scripts]
kitsune = "kitsune.server:main"
kitsune-bridge = "kitsune.bridge:run"

[tool.hatch.build.targets.wheel]
packages = ["src/kitsune"]
