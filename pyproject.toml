[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitsune-browser-mcp"
version = "0.2.1"
description = "MCP server that lets AI agents drive your running Firefox or Zen browser through an extension."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "junyeong-nero" }]
keywords = ["mcp", "firefox", "zen-browser", "browser-automation", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2",  # mcp 2.x renamed FastMCP to MCPServer
    "httpx>=0.27.0",
    "websockets>=14.2",
]

[project.optional-dependencies]
# Native trusted clicks on macOS (browser_trusted_click); cliclick on PATH also works.
macos = ["pyobjc-framework-Quartz>=10; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/junyeong-nero/kitsune"
Documentation = "https://github.com/junyeong-nero/kitsune/blob/main/docs/guide.md"
Issues = "https://github.com/junyeong-nero/kitsune/issues"
Changelog = "https://github.com/junyeong-nero/kitsune/releases"

[project.scripts]
kitsune = "kitsune.server:main"
kitsune-bridge = "kitsune.bridge:run"

[tool.hatch.build.targets.wheel]
packages = ["src/kitsune"]

[tool.hatch.build.targets.sdist]
include = ["/src/kitsune", "/tests", "/README.md", "/LICENSE"]
