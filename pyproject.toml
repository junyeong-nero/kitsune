[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# kitsune-browser: the Python API, the agent tools, the bridge and, with the mcp extra, the MCP
# server. kitsune-browser-mcp (packages/kitsune-browser-mcp) installs that server's commands.
[project]
name = "kitsune-browser"
version = "0.7.1"
description = "Drive the Firefox, Zen, or LibreWolf browser you already have open from Python or an AI agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "junyeong-nero" }]
keywords = ["firefox", "zen-browser", "browser-automation", "ai-agents", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7,<3",  # the agent tools' parameter descriptions (kitsune.tools)
    "websockets>=14.2",
]

[project.optional-dependencies]
# The MCP server, kitsune.server; kitsune-browser-mcp installs it with the `kitsune` command.
mcp = ["mcp[cli]>=1.2.0,<2"]  # mcp 2.x renamed FastMCP to MCPServer
# Native trusted clicks on macOS (browser_trusted_click); cliclick on PATH also works.
macos = ["pyobjc-framework-Quartz>=10; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/junyeong-nero/kitsune"
Documentation = "https://github.com/junyeong-nero/kitsune/blob/main/docs/guide.md"
Issues = "https://github.com/junyeong-nero/kitsune/issues"
Changelog = "https://github.com/junyeong-nero/kitsune/releases"

[project.scripts]
kitsune-bridge = "kitsune.bridge:run"

[dependency-groups]
# A checkout runs the MCP server and every test: `uv run kitsune`, `uv run python -m unittest`.
dev = ["kitsune-browser-mcp"]

[tool.uv.workspace]
members = ["packages/kitsune-browser-mcp"]

[tool.uv.sources]
kitsune-browser-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kitsune"]

[tool.hatch.build.targets.sdist]
include = ["/src/kitsune", "/tests", "/README.md", "/LICENSE"]
